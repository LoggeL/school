<linearGradient id="ceramic" x2="0" y2="1"><stop stop-color="#faf9ec"/><stop offset="1" stop-color="#cdd8c7"/></linearGradient>
<filter id="shadow" x="-.5" y="-1" width="2" height="3"><feGaussianBlur stdDeviation="14"/></filter>
